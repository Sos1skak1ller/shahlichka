[project]
name = "gaming-sim"
version = "0.1.0"
description = "Синтетическая популяция и когортная симуляция игрового слоя Х5 Клуб"
requires-python = ">=3.11"
dependencies = [
    "gaming-engine",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "jsonschema>=4.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaming_sim"]

[tool.uv.sources]
gaming-engine = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["slow: long-running (10k population)"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
